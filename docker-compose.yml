version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://dealx:dealx@postgres:5432/dealx
    volumes:
      - ./backend:/app
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=dealx
      - POSTGRES_PASSWORD=dealx
      - POSTGRES_DB=dealx
    volumes:
      - dealx_pgdata:/var/lib/postgresql/data

volumes:
  dealx_pgdata:
